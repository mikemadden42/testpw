version: 2

builds:
  - binary: testpw
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos: [darwin, linux, windows]
    goarch: ["386", amd64, arm64]
    ignore:
      - goos: darwin
        goarch: "386"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
